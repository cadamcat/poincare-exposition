mainfont: LibertinusSerif
mainfontoptions:
  - Extension=.otf
  - UprightFont=*-Regular
  - BoldFont=*-Bold
  - ItalicFont=*-Italic
  - BoldItalicFont=*-BoldItalic
mathfont: LibertinusMath-Regular.otf
monofont: FreeMono.otf
monofontoptions:
  - Scale=0.92
  - BoldFont=FreeMonoBold.otf
header-includes:
  - \usepackage{newunicodechar}
  - \newunicodechar{ᵐ}{\textsuperscript{m}}
  - \newunicodechar{𝕊}{\ensuremath{\mathbb{S}}}
  - \newunicodechar{𝓡}{\ensuremath{\mathcal{R}}}
  - \newunicodechar{ₕ}{\ensuremath{_{\mathrm{h}}}}
  - \newunicodechar{ₜ}{\ensuremath{_{\mathrm{t}}}}
  - \usepackage{etoolbox}
  - \AtBeginEnvironment{longtable}{\small}
  - \AtBeginEnvironment{Shaded}{\small}
  - \AtBeginEnvironment{verbatim}{\small}
link-citations: true
